<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Administration A4P Jeux</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap">
<style>

/* Concept : tableau tactique de vestiaire. Fond vert nuit, traits de craie, trois courbes de suivi. */
/* Charte A4P Mental : bleu marine #222A41, logo blanc, Open Sans. Terrain de rugby en plan d'architecte. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#E6EAF3; --line:#CFD6E6;
  --fg:#222A41; --muted:#525F82; --soft:#4B5E97; --accent:#222A41; --accent-fg:#FFFFFF; --accent-ink:#222A41;
  --turf:#2E6B3C; --turf-2:#337543; --chalk:#F4F7F2; --ball:#B4561F;
  --perf:#2468D8; --coh:#C42B71; --well:#B97A00;
  --f-exig:#B83A2B; --f-cad:#157A76; --f-col:#6A42BD; --f-dev:#2F7F2E;
  --good:#1E7A3C; --bad:#B3261E;
  --font-d:"Open Sans","Segoe UI",system-ui,sans-serif;
  --font-b:"Open Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#222A41; --surface:#2B3552; --surface-2:#343F61; --line:#434F76;
    --fg:#F4F6FB; --muted:#AAB5D2; --soft:#A8B8E8; --accent:#FFFFFF; --accent-fg:#222A41; --accent-ink:#FFFFFF;
    --turf:#1F5232; --turf-2:#245B37; --chalk:#E8EFE6; --ball:#D2733A;
    --perf:#6AAEFF; --coh:#FF7FB0; --well:#F2B33D;
    --f-exig:#FF8A78; --f-cad:#4FC7C0; --f-col:#B39AF5; --f-dev:#7CD878;
    --good:#6FD18A; --bad:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#222A41; --surface:#2B3552; --surface-2:#343F61; --line:#434F76;
  --fg:#F4F6FB; --muted:#AAB5D2; --soft:#A8B8E8; --accent:#FFFFFF; --accent-fg:#222A41; --accent-ink:#FFFFFF;
  --turf:#1F5232; --turf-2:#245B37; --chalk:#E8EFE6; --ball:#D2733A;
  --perf:#6AAEFF; --coh:#FF7FB0; --well:#F2B33D;
  --f-exig:#FF8A78; --f-cad:#4FC7C0; --f-col:#B39AF5; --f-dev:#7CD878;
  --good:#6FD18A; --bad:#FF8A80; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--font-d);font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--font-d);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* barre haute */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--font-d);font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.brand span{color:var(--muted);font-size:14px}
.ghost{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:14px;color:var(--muted)}
.ghost:hover{border-color:var(--fg);color:var(--fg)}

/* accueil */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding-block:40px 24px}
.hero h1{font-size:clamp(46px,8vw,88px)}
.hero h1 em{font-style:normal;color:var(--accent-ink)}
.lead{font-size:19px;max-width:52ch;margin-top:16px;color:var(--muted)}
.hero svg{width:100%;height:auto;overflow:visible}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-block:8px 28px}
.rule{border-top:3px solid var(--fg);padding-top:10px}
.rule b{font-family:var(--font-d);font-size:22px;text-transform:uppercase;letter-spacing:.03em;display:block}
.rule span{color:var(--muted);font-size:15px}
.setup{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}
.setup h2{font-size:28px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;max-width:360px;margin-bottom:18px}
.field label{font-weight:600;font-size:14px}
.field input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.role{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px}
.role:hover{border-color:var(--accent)}
.role b{font-family:var(--font-d);font-size:24px;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.role span{font-size:14px;color:var(--muted)}
.role i{font-style:normal;font-family:var(--font-d);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--accent-ink);margin-top:4px}

/* suivi de période */
.progress{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:18px}
.progress div{height:6px;background:var(--line);border-radius:3px}
.progress div.done{background:var(--fg)}
.progress div.now{background:var(--accent)}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-top:22px}
.phead h2{font-size:clamp(32px,5vw,52px)}
.gauges{display:flex;gap:18px;flex-wrap:wrap}
.gauge{min-width:120px}
.gauge .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:600;gap:8px}
.gauge .bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-top:4px}
.gauge .bar i{display:block;height:100%;border-radius:4px}
.gauge .lab span{font-variant-numeric:tabular-nums}
.scene{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-top:16px;display:grid;gap:8px}
.scene p{max-width:78ch;font-size:17px}
.ask{margin-top:24px;font-family:var(--font-d);font-size:22px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.ask span{color:var(--muted);font-weight:500;font-size:17px;text-transform:none;letter-spacing:0;font-family:var(--font-b);margin-left:8px}

/* cartes */
.fams{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:12px}
.fam{display:flex;flex-direction:column;gap:10px;min-width:0}
.fam h3{font-size:20px;display:flex;flex-direction:column;gap:2px;border-bottom:3px solid var(--c);padding-bottom:6px;color:var(--c)}
.fam h3 small{font-family:var(--font-b);text-transform:none;letter-spacing:0;font-weight:500;font-size:13px;color:var(--muted)}
.card{--c:var(--fg);text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:12px 12px 12px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;position:relative;min-width:0}
.card:hover{border-color:var(--c)}
.card .code{grid-row:1/3;width:46px;height:46px;border-radius:8px;background:var(--c);color:var(--surface);display:grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:21px;letter-spacing:.03em}
.card .nm{font-weight:600;line-height:1.2;align-self:end}
.card .ds{font-size:13.5px;color:var(--muted);line-height:1.35;grid-column:2}
.card[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
.card[aria-pressed="true"]::after{content:"Retenu";position:absolute;top:8px;right:8px;font-family:var(--font-d);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;background:var(--c);color:var(--surface);padding:1px 7px;border-radius:3px}
.card[aria-pressed="true"] .nm{padding-right:54px}
.card[disabled]{opacity:.45;cursor:not-allowed}
.f-exig{--c:var(--f-exig)} .f-cad{--c:var(--f-cad)} .f-col{--c:var(--f-col)} .f-dev{--c:var(--f-dev)}

.tray{position:sticky;bottom:0;margin-top:22px;background:var(--bg);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:5}
.slots{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.slot{min-width:92px;height:44px;border:2px dashed var(--line);border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 10px;font-weight:600;font-size:14px;color:var(--muted)}
.slot.on{border-style:solid;color:var(--fg);border-color:var(--c)}
.slot.on b{font-family:var(--font-d);background:var(--c);color:var(--surface);padding:1px 7px;border-radius:4px;font-size:17px}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:12px 22px;font-family:var(--font-d);font-weight:700;font-size:20px;letter-spacing:.05em;text-transform:uppercase}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{background:var(--surface-2);color:var(--muted);cursor:not-allowed;filter:none}
.btn.alt{background:none;border:2px solid var(--fg);color:var(--fg)}

/* résultats */
.res{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:28px;margin-top:20px;align-items:start}
.res h2{font-size:clamp(34px,5vw,54px);color:var(--accent-ink)}
.voices{display:grid;gap:12px;margin-top:16px}
.voice{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:12px 14px}
.voice q{display:block;font-size:17px;quotes:"« " " »"}
.voice cite{display:block;margin-top:6px;font-style:normal;font-size:13px;color:var(--muted);font-weight:600}
.voice cite b{color:var(--c)}
.v-p{--c:var(--perf)} .v-c{--c:var(--coh)} .v-w{--c:var(--well)}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.g-grid{stroke:var(--line);stroke-width:1}
.g-tick{fill:var(--muted);font-size:11px;font-family:var(--font-b)}
.g-axis{stroke:var(--muted);stroke-width:1}
.ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ln.ref{stroke-width:2;stroke-dasharray:5 5;opacity:.6}
.ln.p{stroke:var(--perf)} .ln.c{stroke:var(--coh)} .ln.w{stroke:var(--well)}
.dot.p{fill:var(--perf)} .dot.c{fill:var(--coh)} .dot.w{fill:var(--well)}
.dot{stroke:var(--surface);stroke-width:2}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:14px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.legend em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
.deltas{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.dl{border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.dl.up{color:var(--good)} .dl.dn{color:var(--bad)} .dl.eq{color:var(--muted)}
.actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}

/* bilan */
.verdict{padding-block:30px 8px;display:grid;gap:10px}
.verdict h1{font-size:clamp(40px,7vw,78px)}
.verdict p{font-size:19px;max-width:70ch;color:var(--muted)}
.verdict p strong{color:var(--fg)}
.sect{margin-top:34px}
.sect>h2{font-size:30px;margin-bottom:12px;padding-bottom:6px;border-bottom:3px solid var(--fg)}
.toggle{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;font-weight:600}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.bal{display:grid;gap:10px}
.balrow{display:grid;grid-template-columns:150px 1fr 56px;gap:12px;align-items:center;font-weight:600}
.balrow .tr{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.balrow .tr i{display:block;height:100%;background:var(--c);border-radius:7px}
.balrow span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.key{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:8px;padding:14px}
.key b{font-family:var(--font-d);font-size:21px;text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:4px;color:var(--c)}
.key span{font-size:15px;color:var(--muted)}
.later{background:var(--surface);border:1px dashed var(--muted);border-radius:8px;padding:14px 16px;font-size:16px}
.journal{display:grid;gap:10px}
.jr{display:grid;grid-template-columns:200px 1fr;gap:6px 18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.jr .when b{font-family:var(--font-d);font-size:20px;text-transform:uppercase;letter-spacing:.03em;display:block;line-height:1.1}
.jr .when span{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-family:var(--font-d);font-weight:700;letter-spacing:.04em;font-size:17px;padding:1px 9px;border-radius:4px;background:var(--c);color:var(--surface)}
.jr .notes{grid-column:2;font-size:14px;color:var(--muted)}
.jr .notes div::before{content:"› "}
.qs{display:grid;gap:10px;counter-reset:q}
.qs li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px 12px 52px;position:relative;font-size:17px}
.qs li::before{counter-increment:q;content:counter(q);position:absolute;left:12px;top:9px;width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:17px}
.qs{padding:0;margin:0}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:980px){
  .fams{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero,.res{grid-template-columns:1fr}
  .keys{grid-template-columns:1fr}
}
@media (max-width:640px){
  .fams{grid-template-columns:1fr}
  .rules{grid-template-columns:1fr}
  .jr{grid-template-columns:1fr}
  .jr .notes{grid-column:1}
  .balrow{grid-template-columns:110px 1fr 44px}
  .hero{padding-block:24px 8px}
}
@media (prefers-reduced-motion:no-preference){
  .screen{animation:in .25s ease-out}
  @keyframes in{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
/* ajouts multi-équipes */
:root{--t1:#2468D8;--t2:#C42B71;--t3:#B97A00;--t4:#157A76;--t5:#6A42BD;--t6:#B83A2B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--t1:#5AA2FF;--t2:#FF6FA6;--t3:#F2B33D;--t4:#4FC7C0;--t5:#B39AF5;--t6:#FF8A78}}
:root[data-theme="dark"]{--t1:#5AA2FF;--t2:#FF6FA6;--t3:#F2B33D;--t4:#4FC7C0;--t5:#B39AF5;--t6:#FF8A78}
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.stepper button{min-width:48px;height:48px;border:2px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--font-d);font-weight:700;font-size:24px}
.stepper button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.teamsetup{display:grid;gap:10px;margin-bottom:18px}
.ts{display:grid;grid-template-columns:auto minmax(140px,1fr) auto;gap:10px 12px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.ts .sw{width:14px;height:36px;border-radius:4px;background:var(--c)}
.ts input,.ts select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);min-width:0}
.ts .roster{grid-column:2/4;font-size:13px;color:var(--muted)}
.rolebox{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:6px}
.rb{border-top:3px solid var(--fg);padding-top:8px}
.rb b{font-family:var(--font-d);font-size:21px;text-transform:uppercase;letter-spacing:.03em;display:block}
.rb span{font-size:14px;color:var(--muted)}
.lab2{font-weight:600;font-size:14px;margin-bottom:6px;display:block}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.tab{background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:600;display:flex;align-items:center;gap:8px}
.tab i{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block}
.tab[aria-selected="true"]{border-color:var(--c)}
.tab small{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.ok small{color:var(--good)}
.lens{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:14px}
.ln2{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:3px}
.ln2 b{font-family:var(--font-d);font-size:17px;text-transform:uppercase;letter-spacing:.04em}
.ln2 em{font-style:normal;font-size:12.5px;color:var(--muted)}
.ln2 span{font-size:15px}
.card{grid-template-columns:auto 1fr}
.card .code{font-size:24px}
.card .pts{grid-column:1/3;display:flex;align-items:center;gap:10px;margin-top:6px}
.card .pts button{width:40px;height:40px;border:2px solid var(--line);border-radius:8px;background:var(--bg);font-size:22px;font-weight:700;line-height:1}
.card .pts button:hover:not([disabled]){border-color:var(--c)}
.card .pts button[disabled]{opacity:.35;cursor:not-allowed}
.card .pts output{font-family:var(--font-d);font-weight:700;font-size:26px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.card.has{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
.card[aria-pressed]::after{content:none}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent);display:inline-block}
.dots i.on{background:var(--accent)}
.tray .info{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-weight:600}
.rank{overflow-x:auto;margin-top:14px}
.rank table{border-collapse:collapse;width:100%;min-width:480px;font-variant-numeric:tabular-nums}
.rank th,.rank td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.rank th{font-family:var(--font-d);text-transform:uppercase;letter-spacing:.06em;font-size:15px;color:var(--muted)}
.rank td:nth-child(n+3),.rank th:nth-child(n+3){text-align:right}
.rank .tn{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.rank .tn i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ln.tm{stroke:var(--c)}
.dot.tm{fill:var(--c)}
.rolesq{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.rolesq h3{font-size:22px;margin-bottom:8px}
.rolesq ol{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15.5px}
.who{font-size:14px;color:var(--muted);margin-top:6px}
.legend .dsh{width:22px;height:0;border-top:3px solid var(--c);border-radius:0;background:none}

.tcard{display:grid;gap:8px}
.prof{background:var(--bg);border:1px solid var(--line);border-radius:8px}
.prof summary{cursor:pointer;padding:10px 12px;font-weight:600;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.prof summary .ps{font-weight:500;font-size:13px;color:var(--muted)}
.pbody{padding:4px 14px 14px;display:grid;gap:14px}
.pbody select,.pbody input[type=number]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);max-width:100%}
.pbody input[type=number]{width:100px}
.q.two{display:flex;gap:24px;flex-wrap:wrap}
.cks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px 16px}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:15px;cursor:pointer}
.ck input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.pbody .ghost{justify-self:start}
.brief{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:16px}
.bc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:4px;align-content:start}
.bc b{font-family:var(--font-d);font-size:18px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.bc span{font-size:16px}
.pl{margin:0;padding-left:18px;font-size:15.5px;display:grid;gap:2px}
.obj{margin-top:14px;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:12px 14px;display:grid;gap:4px;background:var(--surface)}
.obj.ok{--c:var(--good)} .obj.ko{--c:var(--bad)}
.obj span{color:var(--muted);font-size:15px}

/* terrain de rugby */
.plf{fill:var(--turf)} .plf2{fill:var(--turf-2)}
.pl{fill:none;stroke:var(--chalk);stroke-width:1.6}
.pl.dsh{stroke-dasharray:5 5;opacity:.85}
.post{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.postd{fill:var(--accent)}
.route{fill:none;stroke:var(--accent);stroke-width:4;stroke-dasharray:2 9;stroke-linecap:round}
.pdot{stroke:var(--chalk);stroke-width:2}
.ball{fill:var(--ball);stroke:var(--chalk);stroke-width:1.5}
.stitch{stroke:var(--chalk);stroke-width:1.5;fill:none;stroke-linecap:round}
.dim line{stroke:var(--muted);stroke-width:1.2}
.dim text{fill:var(--muted);font-size:13px;font-family:var(--font-d);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.sdone{fill:var(--accent);stroke:var(--chalk);stroke-width:1.5}
.sleft{fill:none;stroke:var(--chalk);stroke-width:1.5;opacity:.8}
.strip{margin-top:18px}
.strip svg{display:block;width:100%;height:auto}
.plabels{display:flex;margin-top:6px;font-family:var(--font-d);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.plabels span{text-align:center;min-width:0}
.plabels span.on{color:var(--fg);font-weight:700}
.g-ph{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4;opacity:.7}
.g-phl{fill:var(--muted);font-size:11px;font-family:var(--font-d);font-weight:600;letter-spacing:.12em}
.jph{font-size:22px;margin-top:10px;color:var(--accent-ink)}
.brand{align-items:center}
.brand svg{width:34px;height:34px;flex:none}
.mk-bg{fill:var(--accent)} .mk-fg{stroke:var(--accent-fg);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:640px){.plabels{font-size:12px;letter-spacing:.04em}}

h1,h2,h3{font-weight:600;text-transform:none;letter-spacing:-.01em;line-height:1.15}
.hero h1{font-weight:300;font-size:clamp(40px,6.5vw,76px);line-height:1.05}
.hero h1 em{color:var(--soft);font-weight:600}
.verdict h1{font-weight:300;font-size:clamp(32px,5.2vw,58px)}
.phead h2,.res h2{font-size:clamp(26px,4vw,42px)}
.sect>h2,.setup h2{font-size:26px}
.brand{gap:12px;align-items:center}
.brand b{font-weight:400;text-transform:none;letter-spacing:0;font-size:20px}
.rule b,.role b,.rb b,.ln2 b,.jr .when b,.key b,.rolesq h3{text-transform:none;letter-spacing:0;font-size:18px;font-weight:600;line-height:1.25}
.role b{font-size:20px}
.fam h3{font-size:18px;text-transform:none}
.ask{text-transform:none;font-size:20px;letter-spacing:0;font-weight:600}
.btn{text-transform:none;letter-spacing:0;font-size:17px;font-weight:600}
.jph{font-size:20px;color:var(--soft)}
.post{stroke:var(--chalk)} .postd{fill:var(--chalk)}
.route{stroke:var(--chalk)}
.sdone{fill:var(--chalk);stroke:var(--turf)}
.verdict p{font-weight:400}
.lead{font-weight:400}
/* connexion, parties, débrief, impression */
.acct{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.acct .who2{color:var(--muted)} .acct .who2 b{color:var(--fg)}
.savestat{font-size:13px;color:var(--muted)}
a.ghost{text-decoration:none;display:inline-block}
.top{gap:12px 18px}
.loginbox{max-width:460px;margin:48px auto 24px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px}
.loginbox h1{font-size:38px;font-weight:300}
.lform{display:grid;gap:8px;margin-top:18px}
.lform input,.field input[type=text]{font:inherit}
.lform input{padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
.lform .btn{margin-top:10px;justify-self:start}
.err{color:var(--bad);font-size:15px;min-height:1.4em;margin:8px 0 0}
.btn.sm{font-size:15px;padding:8px 16px}
.ghost.danger{border-color:var(--bad);color:var(--bad)}
.sessl{display:grid;gap:10px}
.sess{display:flex;justify-content:space-between;gap:12px 20px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.sess b{display:block;font-size:17px}
.sess span{font-size:14px;color:var(--muted)}
.dq{display:grid;gap:6px;margin-bottom:14px}
.dq span{font-weight:600;font-size:15px}
.dq textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);resize:vertical;min-height:70px}
.dgen{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:4px 18px}
.dsecs{display:grid;gap:10px;margin-top:6px}
.dsec{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 14px 6px}
.dsec summary{cursor:pointer;font-weight:600;padding:12px 0}
.dsec[open] summary{margin-bottom:6px}
#printarea{display:none}
.pr-head{display:flex;gap:14px;align-items:center;border-bottom:2px solid var(--fg);padding-bottom:10px;margin-bottom:14px}
.pr-head .logo{width:72px;height:28px}
.pr-t{font-size:20px;font-weight:600}.pr-s{font-size:13px;color:var(--muted)}
.pr-team h2 small{font-size:13px;color:var(--muted);font-weight:400;margin-left:8px}
.pr-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px}
.pr-prof{font-size:13px;color:var(--muted)}
.pr-qa{margin:8px 0}.pr-qa b{font-size:13px}.pr-qa p{margin:2px 0 0;font-size:14px}
@media print{
  :root:root:root{
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#E6EAF3; --line:#CFD6E6;
    --fg:#222A41; --muted:#525F82; --soft:#4B5E97; --accent:#222A41; --accent-fg:#FFFFFF; --accent-ink:#222A41;
    --turf:#2E6B3C; --turf-2:#337543; --chalk:#F4F7F2; --ball:#B4561F;
    --perf:#2468D8; --coh:#C42B71; --well:#B97A00;
    --f-exig:#B83A2B; --f-cad:#157A76; --f-col:#6A42BD; --f-dev:#2F7F2E;
    --good:#1E7A3C; --bad:#B3261E;
    --t1:#2468D8;--t2:#C42B71;--t3:#B97A00;--t4:#157A76;--t5:#6A42BD;--t6:#B83A2B;
    color-scheme:light;
  }
  @page{size:A4;margin:14mm 12mm}
  html,body{background:#fff !important;color:var(--fg);padding:0 !important;font-size:12px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wrap{display:none !important}
  #printarea{display:block}
  #printarea h2{font-size:20px;margin:14px 0 8px;border-bottom:2px solid var(--fg);padding-bottom:4px}
  #printarea h3{font-size:15px;margin:14px 0 6px}
  .pr-team{break-before:page}
  .pr-avoid,.jr,.obj,.pr-qa,.rank tr{break-inside:avoid}
  .pr-charts{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
  .pr-charts .pr-avoid:first-child{grid-column:1/3}
  #printarea svg{max-width:100%;height:auto}
  .jr{grid-template-columns:150px 1fr;padding:6px 8px;gap:2px 10px}
  .jr .notes{font-size:11px}
  .jph{font-size:15px}
  .chartbox{border:0;padding:0}
  .balrow{grid-template-columns:120px 1fr 50px}
}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
.accl{display:grid;gap:12px}
.acc-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.acc-h b{font-size:18px}.acc-h span{color:var(--muted);font-size:14px}
.acc-g,.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 18px;align-items:end}
.acc label,.cgrid label{display:grid;gap:4px;font-weight:600;font-size:14px}
.acc input[type=text],.acc input[type=number],.acc input[type=date],.acc select,.cgrid input,.cgrid select,.pwrow input{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%;min-width:0}
.qrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qrow input[type=number]{width:110px}
.qrow .used{font-size:22px;min-width:30px}
.ck{display:flex !important;grid-template-columns:none;align-items:center;gap:8px;font-weight:500 !important;cursor:pointer}
.ck input{width:18px !important;height:18px;padding:0;accent-color:var(--accent)}
.onl{align-self:center}
.pwrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pwrow input{max-width:260px}
.created{margin-top:16px;border:1px solid var(--good);border-left:6px solid var(--good);border-radius:8px;padding:14px 16px;display:grid;gap:6px;background:var(--surface)}
.created code{background:var(--surface-2);padding:2px 8px;border-radius:5px;font-size:15px;user-select:all}
.okm{color:var(--good);font-weight:600;margin:12px 0 0}

.created .ghost{justify-self:start}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo" role="img" aria-label="Logo A4P Mental"></span><b>A4P Mental</b><span>Administration</span></div>
    <div id="acct" class="acct"></div>
  </header>
  <main id="app" class="screen" aria-live="polite"><p class="who" style="padding-block:40px">Chargement…</p></main>
  <footer class="foot"><span>Une architecture mentale. Pas une béquille émotionnelle.</span><span>Accès réservé aux administrateurs</span></footer>
</div>
<script>
const CFG=window.A4P_CONFIG||{};
const $app=document.getElementById("app"),$acct=document.getElementById("acct");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let sb=null,ME=null,ROWS=[],MSG="",MSGOK=true,NEWPW="",CREATED=null,pwOpen=null,delOpen=null;

function gate(t,withLink){
  $app.innerHTML='<section class="screen"><div class="loginbox"><div class="eyebrow">Administration</div><h1>Accès réservé</h1><p class="lead" style="margin-top:10px">'+esc(t)+'</p><div class="actions"><a class="btn" href="index.html" style="text-decoration:none;display:inline-block">Ouvrir le jeu</a></div></div></section>';
}
function genPw(){
  const a="abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789";const r=new Uint32Array(12);crypto.getRandomValues(r);
  return Array.from(r,x=>a[x%a.length]).join("");
}
async function token(){const {data}=await sb.auth.getSession();return data.session?data.session.access_token:null;}
async function api(body){
  const t=await token();
  const r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify(body)});
  let j={};try{j=await r.json();}catch(e){}
  return {ok:r.ok,data:j};
}
async function load(){
  const {data,error}=await sb.from("profiles").select("*").order("created_at",{ascending:false});
  ROWS=error?[]:data;
}
const fmtDate=d=>d?new Date(d).toISOString().slice(0,10):"";
function row(p){
  const unl=p.quota==null;
  return '<div class="acc" data-row="'+p.id+'"><div class="acc-h"><b>'+esc(p.display_name||"")+'</b><span>'+esc(p.email||"")+'</span></div>'
   +'<div class="acc-g">'
   +'<label>Nom<input type="text" data-f="name" value="'+esc(p.display_name||"")+'"></label>'
   +'<label>Rôle<select data-f="role"><option value="coach"'+(p.role==="coach"?" selected":"")+'>Utilisateur</option><option value="admin"'+(p.role==="admin"?" selected":"")+'>Administrateur</option></select></label>'
   +'<label>Accès accordés<span class="qrow"><input type="number" min="0" step="1" data-f="quota" value="'+(unl?"":p.quota)+'"'+(unl?" disabled":"")+'><label class="ck"><input type="checkbox" data-f="unl"'+(unl?" checked":"")+'><span>Illimité</span></label></span></label>'
   +'<label>Accès utilisés<span class="qrow"><b class="used">'+p.used+'</b><button type="button" class="ghost" data-act="zero" data-id="'+p.id+'">Remettre à zéro</button></span></label>'
   +'<label>Expire le<input type="date" data-f="exp" value="'+fmtDate(p.expires_at)+'"></label>'
   +'<label class="ck onl"><input type="checkbox" data-f="active"'+(p.active?" checked":"")+'><span>Compte actif</span></label>'
   +'</div><div class="actions" style="margin:12px 0 0">'
   +'<button type="button" class="btn sm" data-act="save" data-id="'+p.id+'">Enregistrer</button>'
   +'<button type="button" class="ghost" data-act="pw" data-id="'+p.id+'">Nouveau mot de passe</button>'
   +(delOpen===p.id?'<button type="button" class="ghost danger" data-act="delok" data-id="'+p.id+'">Confirmer la suppression</button><button type="button" class="ghost" data-act="delno">Annuler</button>':'<button type="button" class="ghost" data-act="del" data-id="'+p.id+'">Supprimer</button>')
   +'</div>'
   +(pwOpen===p.id?'<div class="pwrow"><input type="text" id="pw-'+p.id+'" value="'+esc(genPw())+'" aria-label="Nouveau mot de passe"><button type="button" class="btn sm" data-act="pwok" data-id="'+p.id+'">Appliquer</button><span class="who">Notez-le : il ne sera plus affiché ensuite.</span></div>':'')
   +'</div>';
}
function render(){
  const stats='<span>'+ROWS.length+' compte'+(ROWS.length>1?"s":"")+'</span>';
  $app.innerHTML='<section class="screen"><div class="phead"><div><div class="eyebrow">Administration</div><h2>Comptes et accès</h2></div></div>'
   +(MSG?'<p class="'+(MSGOK?'okm':'err')+'" role="status">'+esc(MSG)+'</p>':'')
   +(CREATED?'<div class="created"><b>Compte créé. À transmettre à la personne :</b><div>Identifiant : <code>'+esc(CREATED.email)+'</code></div><div>Mot de passe : <code>'+esc(CREATED.password)+'</code></div><div>Adresse du jeu : <code>'+esc(location.origin)+'/</code></div><button type="button" class="ghost" data-act="copy">Copier</button></div>':'')
   +'<div class="setup" style="margin-top:16px"><h2>Créer un compte</h2><form id="cf" class="cgrid">'
   +'<label>Nom<input type="text" id="cn" placeholder="Prénom Nom" required></label>'
   +'<label>Identifiant (email)<input type="email" id="ce" required autocomplete="off"></label>'
   +'<label>Mot de passe<span class="qrow"><input type="text" id="cp" value="'+esc(NEWPW||(NEWPW=genPw()))+'" minlength="8" required><button type="button" class="ghost" data-act="gen">Générer</button></span></label>'
   +'<label>Accès accordés (parties)<span class="qrow"><input type="number" id="cq" min="0" step="1" value="3"><label class="ck"><input type="checkbox" id="cu"><span>Illimité</span></label></span></label>'
   +'<label>Expire le (facultatif)<input type="date" id="cx"></label>'
   +'<label>Rôle<select id="cr"><option value="coach">Utilisateur</option><option value="admin">Administrateur</option></select></label>'
   +'<div><button class="btn" type="submit">Créer le compte</button></div></form></div>'
   +'<div class="sect"><h2>Comptes existants</h2><p class="who" style="margin:0 0 12px">'+stats+'. Un accès correspond à une partie lancée. Rouvrir ou reprendre une partie ne consomme rien.</p><div class="accl">'+ROWS.map(row).join("")+'</div></div></section>';
}
function flash(t,ok){MSG=t;MSGOK=ok!==false;render();window.scrollTo({top:0});}
function readRow(id){
  const c=document.querySelector('[data-row="'+id+'"]');
  const g=f=>c.querySelector('[data-f="'+f+'"]');
  const unl=g("unl").checked;
  return {display_name:g("name").value.trim(),role:g("role").value,quota:unl?null:Math.max(0,parseInt(g("quota").value,10)||0),expires_at:g("exp").value?new Date(g("exp").value+"T23:59:59").toISOString():null,active:g("active").checked};
}
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");if(!t) return;
  const a=t.dataset.act,id=t.dataset.id;
  if(a==="logout"){await sb.auth.signOut();location.href="index.html";}
  else if(a==="gen"){NEWPW=genPw();document.getElementById("cp").value=NEWPW;}
  else if(a==="copy"){const txt="Identifiant : "+CREATED.email+"\nMot de passe : "+CREATED.password+"\nAdresse du jeu : "+location.origin+"/";try{await navigator.clipboard.writeText(txt);t.textContent="Copié";}catch(err){t.textContent="Sélectionnez et copiez le texte ci-dessus";}}
  else if(a==="save"){
    const v=readRow(id);
    const {error}=await sb.from("profiles").update(v).eq("id",id);
    if(error) flash("Enregistrement refusé : "+error.message,false);
    else {await load();flash("Modifications enregistrées.");}
  }
  else if(a==="zero"){
    const {error}=await sb.from("profiles").update({used:0}).eq("id",id);
    if(error) flash("Action refusée : "+error.message,false); else {await load();flash("Compteur remis à zéro.");}
  }
  else if(a==="pw"){pwOpen=pwOpen===id?null:id;render();}
  else if(a==="pwok"){
    const r=await api({action:"reset_password",id,password:document.getElementById("pw-"+id).value});
    const pw=document.getElementById("pw-"+id)?document.getElementById("pw-"+id).value:"";
    pwOpen=null;
    if(r.ok) {const p=ROWS.find(x=>x.id===id);CREATED={email:p.email,password:pw};flash("Mot de passe modifié.");}
    else flash(r.data.error||"Échec",false);
  }
  else if(a==="del"){delOpen=id;render();}
  else if(a==="delno"){delOpen=null;render();}
  else if(a==="delok"){
    delOpen=null;const r=await api({action:"delete",id});
    if(r.ok){await load();flash("Compte supprimé.");} else flash(r.data.error||"Échec",false);
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.f==="unl"){const q=t.closest("[data-row]").querySelector('[data-f="quota"]');q.disabled=t.checked;}
  if(t.id==="cu"){document.getElementById("cq").disabled=t.checked;}
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="cf") return;
  e.preventDefault();
  const unl=document.getElementById("cu").checked;
  const body={action:"create",display_name:document.getElementById("cn").value,email:document.getElementById("ce").value,password:document.getElementById("cp").value,
    quota:unl?null:parseInt(document.getElementById("cq").value,10)||0,role:document.getElementById("cr").value,
    expires_at:document.getElementById("cx").value?new Date(document.getElementById("cx").value+"T23:59:59").toISOString():null};
  const r=await api(body);
  if(!r.ok){flash(r.data.error||"Création impossible",false);return;}
  CREATED={email:body.email.trim().toLowerCase(),password:body.password};NEWPW="";
  await load();flash("Compte créé.");
});
async function init(){
  if(!CFG.SUPABASE_URL||/VOTRE/.test(CFG.SUPABASE_URL)||!window.supabase){gate("La connexion à la base n’est pas configurée : renseignez config.js.");return;}
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  const {data}=await sb.auth.getSession();
  if(!data.session){gate("Connectez-vous d’abord sur la page du jeu avec un compte administrateur.");return;}
  const {data:me}=await sb.from("profiles").select("*").eq("id",data.session.user.id).single();
  if(!me||me.role!=="admin"||!me.active){gate("Cette page est réservée aux administrateurs.");return;}
  ME=me;
  $acct.innerHTML='<span class="who2"><b>'+esc(me.display_name||me.email)+'</b></span><a class="ghost" href="index.html">Retour aux jeux</a><button type="button" class="ghost" data-act="logout">Déconnexion</button>';
  await load();render();
}
init();
</script>
</body>
</html>
