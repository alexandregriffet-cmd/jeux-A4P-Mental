/* Concept : tableau tactique de vestiaire. Fond vert nuit, traits de craie, trois courbes de suivi. */
/* Charte A4P Mental : bleu marine #222A41, logo blanc, Open Sans. Terrain de rugby en plan d'architecte. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#E6EAF3; --line:#CFD6E6;
  --fg:#222A41; --muted:#525F82; --soft:#4B5E97; --accent:#222A41; --accent-fg:#FFFFFF; --accent-ink:#222A41;
  --turf:#2E6B3C; --turf-2:#337543; --chalk:#F4F7F2; --ball:#B4561F;
  --perf:#2468D8; --coh:#C42B71; --well:#B97A00;
  --f-exig:#B83A2B; --f-cad:#157A76; --f-col:#6A42BD; --f-dev:#2F7F2E;
  --good:#1E7A3C; --bad:#B3261E;
  --font-d:"Open Sans","Segoe UI",system-ui,sans-serif;
  --font-b:"Open Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#222A41; --surface:#2B3552; --surface-2:#343F61; --line:#434F76;
    --fg:#F4F6FB; --muted:#AAB5D2; --soft:#A8B8E8; --accent:#FFFFFF; --accent-fg:#222A41; --accent-ink:#FFFFFF;
    --turf:#1F5232; --turf-2:#245B37; --chalk:#E8EFE6; --ball:#D2733A;
    --perf:#6AAEFF; --coh:#FF7FB0; --well:#F2B33D;
    --f-exig:#FF8A78; --f-cad:#4FC7C0; --f-col:#B39AF5; --f-dev:#7CD878;
    --good:#6FD18A; --bad:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#222A41; --surface:#2B3552; --surface-2:#343F61; --line:#434F76;
  --fg:#F4F6FB; --muted:#AAB5D2; --soft:#A8B8E8; --accent:#FFFFFF; --accent-fg:#222A41; --accent-ink:#FFFFFF;
  --turf:#1F5232; --turf-2:#245B37; --chalk:#E8EFE6; --ball:#D2733A;
  --perf:#6AAEFF; --coh:#FF7FB0; --well:#F2B33D;

}

p{margin:0}button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
#app{max-width:980px;margin:0 auto;padding:0 0 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand b{font-weight:400;text-transform:none;letter-spacing:0;font-size:20px}
.brand span:not(.logo){color:var(--muted);font-size:14px}
.screen{padding-top:26px;animation:in .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}
h1{font-size:clamp(34px,6.5vw,60px);font-weight:300;text-transform:none;letter-spacing:-.01em;line-height:1.05;margin:6px 0 14px}
h1 em{font-style:normal;font-weight:700;color:var(--soft)}
h1.st{font-size:clamp(28px,5vw,42px);font-weight:600}
h2{font-size:20px;text-transform:none;letter-spacing:0;font-weight:700;margin:0 0 2px}
h3.sub{font-size:14px;letter-spacing:.12em;margin:30px 0 12px;color:var(--muted)}
.lead{font-size:18px;color:var(--muted);max-width:64ch;margin-bottom:22px}
.hint{color:var(--muted);font-size:14px;margin-top:8px}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:14px 22px;font-weight:700;font-size:16px;min-height:48px;margin-top:6px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:15px;min-height:44px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:18px 0 6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;margin-top:8px}
.gcard{display:flex;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.gcard.soon{opacity:.62}
.gn{flex:none;width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:20px}
.gtag{color:var(--soft);font-size:14px;font-weight:600;margin-bottom:8px}

.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 18px}

.lens{background:var(--surface);border-left:4px solid var(--accent);border-radius:8px;padding:14px 18px;margin:0 0 6px}

.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:16px;font-size:16px;min-height:56px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--accent)}

.ol{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:14px;margin-right:2px}

.chipsrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--surface-2);font-size:13px;font-weight:600;border:1px solid var(--line)}

.foot{display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between;border-top:1px solid var(--line);margin-top:40px;padding-top:14px;color:var(--muted);font-size:13px}

.ct{font-weight:600;font-size:15px}

a.ghost{display:inline-flex;align-items:center;text-decoration:none;color:var(--fg)}

function route(g,CUR){
  const n=g.scenes.length,W=600,x=k=>20+k*(W-40)/(n-1);
  let s='<svg class="route" viewBox="0 0 600 40" role="img" aria-label="Situation '+(CUR+1)+' sur '+n+'" xmlns="http://www.w3.org/2000/svg">'+
   '<line x1="20" y1="20" x2="580" y2="20" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>'+
   '<line x1="20" y1="20" x2="'+x(CUR)+'" y2="20" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>';
  g.scenes.forEach((sc,k)=>{
    if(k>0&&sc.phase!==g.scenes[k-1].phase){const mx=(x(k)+x(k-1))/2;s+='<path d="M'+mx+' 6V34" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/>';}
    if(k===CUR) s+='<circle cx="'+x(k)+'" cy="20" r="13" fill="var(--soft)" opacity=".35"/><circle cx="'+x(k)+'" cy="20" r="9" fill="var(--accent)"/>';
    else s+='<circle cx="'+x(k)+'" cy="20" r="6" fill="'+(k<CUR?'var(--accent)':'var(--bg)')+'" stroke="'+(k<CUR?'var(--accent)':'var(--line)')+'" stroke-width="2.5"/>';
  });
  return s+'</svg>';
}
function radar(g,series){
  const cx=130,cy=130,R=88,M=40,ang=[-90,0,90,180].map(a=>a*Math.PI/180);
  const pt=(k,v)=>{const r=Math.min(v,M)/M*R;return [(cx+Math.cos(ang[k])*r).toFixed(1),(cy+Math.sin(ang[k])*r).toFixed(1)];};
  let s='<svg class="radar" viewBox="0 0 260 260" role="img" aria-label="Profil sur quatre axes" xmlns="http://www.w3.org/2000/svg">';
  [10,20,30,40].forEach(v=>{s+='<polygon points="'+[0,1,2,3].map(k=>pt(k,v).join(',')).join(' ')+'" fill="none" stroke="var(--line)" stroke-width="1.5"/>';});
  [0,1,2,3].forEach(k=>{const p=pt(k,M);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="var(--line)" stroke-width="1.5"/>';});
  series.forEach(se=>{s+='<polygon points="'+se.pc.map((v,k)=>pt(k,v).join(',')).join(' ')+'" fill="'+(se.fill?'var(--accent)':'none')+'" fill-opacity=".22" stroke="'+(se.fill?'var(--accent)':'var(--soft)')+'" stroke-width="'+(se.fill?3:1.5)+'" stroke-opacity="'+(se.fill?1:.55)+'" stroke-linejoin="round"/>';});
  const lp=[[130,18,'middle'],[246,134,'end'],[130,252,'middle'],[14,134,'start']];
  g.axes.forEach((a,k)=>{s+='<text x="'+lp[k][0]+'" y="'+lp[k][1]+'" text-anchor="'+lp[k][2]+'" font-size="13" font-weight="700" fill="'+a.c+'">'+ESC(a.k)+'</text>';});
  return s+'</svg>';
}

const G=()=>GAMES.find(g=>g.id===S.game);

/* ---------- calculs ---------- */
function shuffle(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function disp(sc,si){return (S.order[si]||sc.opts.map((_,k)=>k)).map(k=>({k,o:sc.opts[k]}));}
function letterOf(si,k){const ord=S.order[si]||[0,1,2,3,4];return L[ord.indexOf(k)];}
function profile(g,picks){ /* picks: tableau (par situation) de tableaux d'indices d'options */
  const tot=g.axes.map(()=>0);
  picks.forEach((arr,si)=>{ (arr||[]).forEach(p=>g.scenes[si].opts[p].s.forEach((v,a)=>tot[a]+=v)); });
  const sum=tot.reduce((x,y)=>x+y,0);
  return tot.map(t=>sum?Math.round(100*t/sum):0);
}
function rolePicks(g,roleId){ return g.scenes.map((_,si)=>{const v=S.votes[si]; return v&&v[roleId]?v[roleId]:[];}); }

/* ---------- gabarits ---------- */
function bars(g,pcts){
  return '<div class="bars">'+g.axes.map((a,k)=>
    '<div class="bar"><div class="bl"><b>'+esc(a.k)+'</b><span>'+pcts[k]+' %</span></div>'+
    '<div class="bt"><i style="width:'+pcts[k]+'%;background:'+a.c+'"></i></div>'+
    '<p>'+esc(a.desc)+'</p></div>').join('')+'</div>';
}
function steps(g){return '<div class="steps2">'+route(g,S.i)+'</div>';}
function steps_old(g){
  let h='<ol class="steps" aria-label="Progression">';
  let last="";
  g.scenes.forEach((sc,k)=>{
    const cls=k<S.i?"done":k===S.i?"cur":"";
    h+='<li class="'+cls+'" title="'+esc(sc.title)+'"><span>'+(k+1)+'</span></li>';
  });
  return h+'</ol>';
}
function header0(){
  return '<header class="top"><div class="brand"><span class="logo" role="img" aria-label="Logo A4P Mental"></span><b>A4P Mental</b><span>Jeux d’accompagnement pour les clubs</span></div>'+
   (S.screen!=="hub"?'<button class="ghost" data-act="home" type="button">Tous les jeux</button>':'')+'</header>';
}

/* ---------- écrans ---------- */
function hub0(){
  return '<div class="eyebrow">Pour tout le club : joueurs, capitaines, staff, dirigeants, bénévoles</div>'+
   '<h1>Cinq jeux pour <em>s’entraîner</em> ensemble</h1>'+
   '<p class="lead">Chaque jeu met le club face à des situations réelles. On choisit, on compare ce que chacun a vu, puis on en parle. Deux façons de jouer : animé en groupe par un coach, ou en entraînement individuel sur téléphone.</p>'+
   '<div class="cards">'+GAMES.map(g=>
     '<article class="gcard'+(g.ready?'':' soon')+'"><div class="gn">'+g.n+'</div><div><div class="gart">'+art(g.id,g)+'</div><h2>'+esc(g.title)+'</h2><div class="gtag">'+esc(g.tag)+'</div><p>'+esc(g.pitch)+'</p>'+
     '<div class="gmeta">'+esc(g.duree)+(g.ready?'':' · Bientôt disponible')+'</div>'+
     (g.ready?'<button class="btn" data-act="open" data-id="'+g.id+'" type="button">Ouvrir ce jeu</button>':'')+'</div></article>').join('')+'</div>';
}
function intro(){
  const g=G();
  return '<div class="eyebrow">Jeu '+g.n+' sur 5 · '+g.scenes.length+' situations · '+esc(g.duree)+'</div>'+
   '<div class="hero"><div><h1>'+esc(g.title)+'</h1><p class="lead">'+esc(g.pitch)+'</p></div><div class="hart">'+art(g.id,g)+'</div></div>'+
   '<h3 class="sub">Quatre repères pour lire les résultats</h3>'+bars(g,g.axes.map(()=>0)).replace(/<span>0 %<\/span>/g,'')+'<div class="fb"><b>Comment ça marche</b><p>Il n’y a pas de bonne réponse. Chaque option a un intérêt et un coût. Vous pouvez choisir une ou deux actions par situation. Le bilan montre sur quoi vous vous appuyez le plus, et ce que vous laissez dans l’ombre.</p></div>'+
   '<h3 class="sub">Comment voulez-vous jouer ?</h3>'+
   '<div class="modes">'+
   '<button class="mode" data-act="mode" data-m="anime" type="button"><b>Animé en groupe</b><span>Un écran partagé. Chaque rôle du club choisit, puis on révèle les choix et on débriefe ensemble.</span></button>'+
   '<button class="mode" data-act="mode" data-m="solo" type="button"><b>Entraînement individuel</b><span>Seul sur son téléphone, dans son rôle. Retour immédiat après chaque choix et profil à la fin.</span></button></div>';
}
function setup(){
  const g=G();
  if(S.mode==="anime"){
    return '<div class="eyebrow">'+esc(g.title)+' · Mode animé</div><h1>Qui joue ?</h1>'+
     '<p class="lead">Retirez les rôles absents. Chaque rôle choisira ce qu’il ferait dans chaque situation.</p>'+
     '<div class="chips">'+ROLES5.map(r=>'<label class="chip"><input type="checkbox" data-act="rolepick" value="'+r.id+'"'+(S.roles.includes(r.id)?' checked':'')+'><span>'+esc(r.name)+'</span></label>').join('')+'</div>'+
     '<button class="btn" data-act="start" type="button"'+(S.roles.length<2?' disabled':'')+'>Commencer</button>'+(S.roles.length<2?'<p class="hint">Choisissez au moins deux rôles.</p>':'');
  }
  return '<div class="eyebrow">'+esc(g.title)+' · Entraînement</div><h1>Quel est votre rôle ?</h1>'+
   '<p class="lead">Les situations seront racontées de votre point de vue.</p>'+
   '<div class="chips">'+ROLES5.map(r=>'<label class="chip"><input type="radio" name="role" data-act="rolesolo" value="'+r.id+'"'+(S.role===r.id?' checked':'')+'><span>'+esc(r.name)+'</span></label>').join('')+'</div>'+
   '<button class="btn" data-act="start" type="button">Commencer</button>';
}
function sceneHead(g,sc){
  return steps(g)+'<div class="eyebrow">'+esc(sc.phase)+' · situation '+(S.i+1)+' sur '+g.scenes.length+'</div><h1 class="st">'+esc(sc.title)+'</h1><p class="lead">'+esc(sc.text)+'</p>';
}
function optsList(sc,si,sel,locked){
  return '<div class="opts">'+disp(sc,si).map((d,j)=>{
    const on=sel.includes(d.k);
    return '<button class="opt'+(on?' sel':'')+'" data-act="pick" data-k="'+d.k+'" type="button" aria-pressed="'+on+'"'+(locked?' disabled':'')+'><span class="ol">'+L[j]+'</span><span>'+esc(d.o.t)+'</span></button>';}).join('')+'</div>';
}
function tradeoff(o){
  return '<div class="to"><p><b class="pl">Ce que cela apporte</b>'+esc(o.plus)+'</p><p><b class="rk">Ce que cela coûte</b>'+esc(o.risk)+'</p></div>';
}
function soloScene(){
  const g=G(),sc=g.scenes[S.i],role=ROLES5.find(r=>r.id===S.role);
  const sel=S.answers[S.i]||[], locked=!!S.done[S.i];
  let h=sceneHead(g,sc)+'<div class="lens"><b>Vu de votre rôle, '+esc(role.name.toLowerCase())+'</b><p>'+esc(sc.lens[S.role])+'</p></div>';
  h+='<h3 class="sub">Que faites-vous ? Une ou deux actions</h3>'+optsList(sc,S.i,sel,locked);
  if(!locked){
    h+='<button class="btn" data-act="valider" type="button"'+(sel.length?'':' disabled')+'>Valider mes choix</button><p class="hint">'+(sel.length?sel.length+' choix sur '+MAXP+' possibles.':'Choisissez au moins une action.')+'</p>';
  } else {
    h+='<div class="fb"><b>Ce que vos choix produisent</b>';
    sel.forEach(k=>{const d=sc.opts[k];h+='<div class="chosen"><span class="ol">'+letterOf(S.i,k)+'</span><div><p class="ct">'+esc(d.t)+'</p>'+tradeoff(d)+'<div class="chipsrow">'+d.s.map((v,a)=>v>0?'<span class="pill" style="--c:'+g.axes[a].c+'">'+esc(g.axes[a].k)+'</span>':'').join('')+'</div></div></div>';});
    h+='<p class="res">'+esc(sc.ressource)+'</p></div>';
    const others=disp(sc,S.i).filter(d=>!sel.includes(d.k));
    h+='<details class="more"><summary>Voir les autres options</summary>'+others.map(d=>'<div class="chosen"><span class="ol">'+letterOf(S.i,d.k)+'</span><div><p class="ct">'+esc(d.o.t)+'</p>'+tradeoff(d.o)+'</div></div>').join('')+'</details>';
    h+='<div class="debrief"><b>Pour y réfléchir</b><p>'+esc(sc.debrief)+'</p></div>';
    h+='<button class="btn" data-act="next" type="button">'+(S.i===g.scenes.length-1?'Voir mon profil':'Situation suivante')+'</button>';
  }
  return h;
}
function animeScene(){
  const g=G(),sc=g.scenes[S.i],v=S.votes[S.i]||{};
  const done=S.roles.every(r=>(v[r]||[]).length>0);
  let h=sceneHead(g,sc)+'<div class="optsmall"><b>Les options</b>'+disp(sc,S.i).map((d,j)=>'<p><span class="ol">'+L[j]+'</span>'+esc(d.o.t)+'</p>').join('')+'</div>';
  h+='<h3 class="sub">Chaque rôle choisit une ou deux actions</h3><div class="vgrid">';
  S.roles.forEach(rid=>{
    const r=ROLES5.find(x=>x.id===rid), mine=v[rid]||[];
    h+='<div class="vcard'+(mine.length?' has':'')+'"><div class="vh"><b>'+esc(r.name)+'</b><span>'+(mine.length?mine.length+' choix':'À choisir')+'</span></div><p class="vl">'+esc(sc.lens[rid])+'</p><div class="vbtns" role="group" aria-label="Choix de '+esc(r.name)+'">'+
     disp(sc,S.i).map((d,j)=>'<button class="vb'+(mine.includes(d.k)?' sel':'')+'" data-act="vote" data-r="'+rid+'" data-k="'+d.k+'" type="button" aria-pressed="'+mine.includes(d.k)+'" aria-label="Option '+L[j]+'">'+L[j]+'</button>').join('')+'</div></div>';
  });
  h+='</div><button class="btn" data-act="reveal" type="button"'+(done?'':' disabled')+'>Révéler les choix</button>'+(done?'':'<p class="hint">Chaque rôle choisit une ou deux options.</p>');
  return h;
}
function animeReveal(){
  const g=G(),sc=g.scenes[S.i],v=S.votes[S.i]||{};
  let h=sceneHead(g,sc)+'<h3 class="sub">Ce que le groupe a choisi</h3><div class="rev">';
  disp(sc,S.i).forEach((d,j)=>{
    const who=S.roles.filter(r=>(v[r]||[]).includes(d.k)).map(r=>ROLES5.find(x=>x.id===r).name);
    h+='<div class="rv'+(who.length?'':' none')+'"><div class="rh"><span class="ol">'+L[j]+'</span><span class="rt">'+esc(d.o.t)+'</span></div>'+
      '<div class="who">'+(who.length?who.map(w=>'<span class="pill">'+esc(w)+'</span>').join(''):'<span class="hint">Personne</span>')+'</div>'+tradeoff(d.o).replace('class="to"','class="to ind"')+'</div>';
  });
  h+='</div><div class="debrief"><b>Question pour le groupe</b><p>'+esc(sc.debrief)+'</p><p class="res">'+esc(sc.ressource)+'</p></div>'+
    '<button class="btn" data-act="next" type="button">'+(S.i===g.scenes.length-1?'Voir le bilan du groupe':'Situation suivante')+'</button>';
  return h;
}
function printBtn(){
  return '<button class="btn" data-act="print" type="button">Imprimer / Enregistrer en PDF</button><p class="hint noprint" id="phint"></p>';
}
function soloEnd(){
  const g=G(),role=ROLES5.find(r=>r.id===S.role),pc=profile(g,S.answers);
  const order=pc.map((v,a)=>[v,a]).sort((x,y)=>y[0]-x[0]);
  const top=g.axes[order[0][1]],low=g.axes[order[3][1]];
  return '<div class="eyebrow">'+esc(g.title)+' · Entraînement · '+esc(role.name)+'</div><h1>Votre profil</h1>'+
   '<p class="lead">Ce profil n’est pas une note. Il montre la place de chaque axe dans vos choix : sur quoi vous vous appuyez, et ce que vous laissez plus volontiers dans l’ombre.</p><div class="rw">'+radar(g,[{pc:pc,fill:1}])+'</div>'+bars(g,pc)+
   '<div class="fb"><b>Votre point d’appui : '+esc(top.k)+'</b><p>'+esc(top.desc)+' C’est l’axe sur lequel vous vous appuyez le plus naturellement.</p></div>'+
   '<div class="fb"><b>Axe le moins mobilisé : '+esc(low.k)+'</b><p>'+esc(low.desc)+' '+esc(low.tip)+'</p></div>'+
   '<h3 class="sub">Vos choix, situation par situation</h3>'+
   '<ul class="recap">'+g.scenes.map((sc,k)=>'<li><b>'+esc(sc.title)+'</b>'+(S.answers[k]||[]).map(p=>'<span>'+esc(sc.opts[p].t)+'</span>').join('')+'</li>').join('')+'</ul>'+
   '<div class="row"><button class="btn" data-act="again" type="button">Rejouer avec un autre rôle</button><button class="ghost" data-act="home" type="button">Tous les jeux</button></div>'+printBtn();
}
function animeEnd(){
  const g=G(),roles=S.roles;
  const per=roles.map(r=>({r,pc:profile(g,rolePicks(g,r))}));
  const grp=g.axes.map((_,a)=>Math.round(per.reduce((t,p)=>t+p.pc[a],0)/per.length));
  const order=grp.map((v,a)=>[v,a]).sort((x,y)=>y[0]-x[0]);
  const top=g.axes[order[0][1]],low=g.axes[order[3][1]];
  const spread=g.scenes.map((sc,si)=>{const v=S.votes[si]||{};const set=new Set();roles.forEach(r=>(v[r]||[]).forEach(k=>set.add(k)));return {si,n:set.size};});
  const div=spread.filter(x=>x.n>=4).sort((a,b)=>b.n-a.n).slice(0,3);
  const con=spread.filter(x=>x.n<=2).slice(0,2);
  let h='<div class="eyebrow">'+esc(g.title)+' · Mode animé · '+roles.length+' rôles</div><h1>Bilan du groupe</h1>'+
   '<p class="lead">Ce profil n’est pas une note. C’est la moyenne des appuis de chaque rôle. Regardez surtout les écarts entre les rôles : c’est là que le débrief devient utile.</p><div class="rw">'+radar(g,per.map(x=>({pc:x.pc})).concat([{pc:grp,fill:1}]))+'<p class="hint">Trait épais : le groupe. Traits fins : chaque rôle.</p></div>'+bars(g,grp)+
   '<div class="fb"><b>Point d’appui du groupe : '+esc(top.k)+'</b><p>'+esc(top.desc)+'</p></div>'+
   '<div class="fb"><b>Axe le moins mobilisé : '+esc(low.k)+'</b><p>'+esc(low.tip)+'</p></div>'+
   '<h3 class="sub">Profil de chaque rôle</h3><div class="tw"><table class="rt2"><thead><tr><th>Rôle</th>'+g.axes.map(a=>'<th>'+esc(a.k)+'</th>').join('')+'</tr></thead><tbody>'+
   per.map(p=>'<tr><th>'+esc(ROLES5.find(x=>x.id===p.r).name)+'</th>'+p.pc.map(v=>'<td>'+v+' %</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  if(div.length) h+='<h3 class="sub">Là où les rôles ne voient pas la même chose</h3><ul class="recap">'+div.map(d=>'<li><b>'+esc(g.scenes[d.si].title)+'</b><span>'+d.n+' options différentes choisies. '+esc(g.scenes[d.si].debrief)+'</span></li>').join('')+'</ul>';
  if(con.length) h+='<h3 class="sub">Là où le groupe est d’accord</h3><ul class="recap">'+con.map(d=>'<li><b>'+esc(g.scenes[d.si].title)+'</b><span>Les rôles se sont rejoints sur peu d’options. Qu’est-ce qui explique cet accord ?</span></li>').join('')+'</ul>';
  h+='<h3 class="sub">Trois questions pour conclure</h3><ol class="qs"><li>Quel réflexe du club ressort le plus, et qu’est-ce qu’il protège ?</li><li>Quelle situation, parmi celles-ci, pourrait arriver dans notre club cette saison ?</li><li>Quel engagement simple prenons-nous dès cette semaine ?</li></ol>'+
   '<div class="row"><button class="btn" data-act="again" type="button">Rejouer ce jeu</button><button class="ghost" data-act="home" type="button">Tous les jeux</button></div>'+printBtn();
  return h;
}

function render(keep){
  let b="";
  const s=S.screen;
  if(CLOUD&&!ACC) b=loginHtml();
  else if(s==="hub") b=hub();
  else if(s==="intro") b=intro();
  else if(s==="setup") b=setup();
  else if(s==="play") b=S.mode==="solo"?soloScene():(S.shown?animeReveal():animeScene());
  else if(s==="end") b=S.mode==="solo"?soloEnd():animeEnd();
  $("#app").innerHTML=header()+'<main class="screen">'+(NOTICE?'<p class="notice" role="alert">'+esc(NOTICE)+'</p>':'')+b+'</main><footer class="foot"><span>Une architecture mentale. Pas une béquille émotionnelle.</span><span>Outil d’entraînement et de prise de conscience</span></footer>';
  if(!keep) window.scrollTo(0,0);
}

/* ---------- comptes et accès (Supabase) ---------- */
const CFG=window.A4P_CONFIG||{};
const CLOUD=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&!/VOTRE/.test(CFG.SUPABASE_URL+CFG.SUPABASE_ANON_KEY)&&window.supabase);
let sb=null,ACC=null,PLAYS=[],NOTICE="",READY=false;
if(CLOUD) sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
function blockReason(p){
  if(!p.active) return "Ce compte est suspendu. Contactez A4P Mental.";
  if(p.expires_at&&new Date(p.expires_at)<new Date()) return "L’accès de ce compte a expiré. Contactez A4P Mental.";
  if(p.quota!==null&&p.quota!==undefined&&p.used>=p.quota) return "Vous avez utilisé tous vos accès. Contactez A4P Mental pour en obtenir d’autres.";
  return "";
}
function accessText(p){
  if(p.quota===null||p.quota===undefined) return "Accès illimités";
  const r=Math.max(0,p.quota-p.used); return r+" accès restant"+(r>1?"s":"")+" sur "+p.quota;
}
function acctHtml(){
  const p=ACC.profile;
  return '<div class="acct noprint"><span class="who2"><b>'+esc(p.display_name||p.email||"")+'</b> · '+esc(accessText(p))+'</span>'+
   (p.role==="admin"?'<a class="ghost" href="admin.html">Administration</a>':'')+
   '<button class="ghost" data-act="logout" type="button">Déconnexion</button></div>';
}
function loginHtml(){
  if(!READY) return '<p class="hint">Chargement…</p>';
  return '<div class="loginbox"><div class="eyebrow">Accès réservé</div><h1 class="st">Connexion</h1><p class="lead" style="margin-top:10px">Entrez les identifiants fournis par A4P Mental pour ouvrir les jeux.</p>'+
   '<form id="lf" class="lform"><label class="lab2" for="le">Identifiant (email)</label><input id="le" type="email" autocomplete="username" required><label class="lab2" for="lp">Mot de passe</label><input id="lp" type="password" autocomplete="current-password" required><button class="btn" type="submit">Se connecter</button><p class="err" id="lerr" role="alert"></p></form></div>';
}
function histHtml(){
  if(!CLOUD||!ACC) return "";
  const fmt=d=>new Date(d).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"});
  const rows=PLAYS.slice(0,8).map(x=>{const g=GAMES.find(y=>y.id===x.game);return '<li><b>'+esc(g?g.title:x.game)+'</b><span>'+(x.mode==="solo"?"Entraînement individuel":"Animé en groupe")+' · '+fmt(x.created_at)+' · '+(x.completed?"Terminé":"Non terminé")+'</span></li>';}).join("");
  return '<h3 class="sub">Mes dernières parties</h3>'+(rows?'<ul class="recap">'+rows+'</ul>':'<p class="hint">Aucune partie pour le moment. Chaque jeu lancé utilise 1 accès.</p>')+
   '<details class="prof more"><summary>Changer mon mot de passe</summary><form id="pf" class="lform"><label class="lab2" for="np">Nouveau mot de passe (8 caractères minimum)</label><input id="np" type="password" autocomplete="new-password" minlength="8" required><button class="btn" type="submit">Enregistrer</button><p class="err" id="perr" role="alert"></p></form></details>';
}
function hub(){return hub0()+histHtml();}
function header(){return header0()+((CLOUD&&ACC)?acctHtml():"");}
async function refreshProfile(){
  const {data}=await sb.from("profiles").select("*").eq("id",ACC.user.id).single(); if(data) ACC.profile=data;
}
async function loadPlays(){
  const {data}=await sb.from("plays").select("id,game,mode,completed,created_at").eq("owner",ACC.user.id).order("created_at",{ascending:false}); PLAYS=data||[];
}
async function afterLogin(user){
  const {data,error}=await sb.from("profiles").select("*").eq("id",user.id).single();
  if(error||!data){await sb.auth.signOut();NOTICE="Ce compte n’est pas configuré. Contactez A4P Mental.";render();return;}
  ACC={user,profile:data}; await loadPlays(); S.screen="hub"; render();
}
async function launch(){
  let pid=null;
  if(CLOUD){
    const br=blockReason(ACC.profile); if(br){NOTICE=br;render();return;}
    const {data,error}=await sb.rpc("create_play",{p_game:S.game,p_mode:S.mode,p_roles:S.mode==="solo"?[S.role]:S.roles});
    if(error){const m=error.message||"";
      NOTICE=/quota/.test(m)?"Vous avez utilisé tous vos accès. Contactez A4P Mental pour en obtenir d’autres.":/disabled/.test(m)?"Ce compte est suspendu. Contactez A4P Mental.":/expired/.test(m)?"L’accès de ce compte a expiré. Contactez A4P Mental.":"Impossible de lancer ce jeu. Réessayez.";
      await refreshProfile(); render(); return;}
    pid=data.id; await refreshProfile();
  }
  NOTICE=""; reset(); newOrder(); S.playId=pid; S.screen="play"; render();
}
async function saveEnd(){
  if(!CLOUD||!S.playId) return;
  const ans=S.mode==="solo"?{role:S.role,answers:S.answers}:{roles:S.roles,votes:S.votes};
  const id=S.playId; S.playId=null;
  await sb.from("plays").update({answers:ans,completed:true}).eq("id",id);
  loadPlays();
}
document.addEventListener("submit",async e=>{
  const f=e.target;
  if(f.id==="lf"){
    e.preventDefault(); const err=document.getElementById("lerr"); err.textContent="";
    const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById("le").value.trim(),password:document.getElementById("lp").value});
    if(error){err.textContent="Identifiant ou mot de passe incorrect.";return;}
    await afterLogin(data.user);
  }else if(f.id==="pf"){
    e.preventDefault(); const err=document.getElementById("perr");
    const {error}=await sb.auth.updateUser({password:document.getElementById("np").value});
    err.textContent=error?"Mot de passe refusé : "+error.message:"Mot de passe modifié."; err.style.color=error?"":"var(--good)";
    if(!error) f.reset();
  }
});
async function init(){
  if(!CLOUD){READY=true;render();return;}
  sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"){ACC=null;PLAYS=[];S.screen="hub";S.game=null;S.playId=null;reset();render();}});
  const {data}=await sb.auth.getSession(); READY=true;
  if(data.session) await afterLogin(data.session.user); else render();
}

/* ---------- actions ---------- */
function reset(){S.i=0;S.votes={};S.answers=[];S.done=[];S.shown=false;S.order=[];}
function newOrder(){const g=G();S.order=g.scenes.map(sc=>shuffle(sc.opts.length));}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t||t.type==="checkbox"||t.type==="radio") return;
  const a=t.dataset.act, g=S.game&&G();
  if(a==="logout"){sb.auth.signOut();return;}
  if(a==="home"){NOTICE="";S.screen="hub";S.game=null;reset();render();}
  else if(a==="open"){NOTICE="";S.game=t.dataset.id;S.screen="intro";reset();render();}
  else if(a==="mode"){S.mode=t.dataset.m;S.screen="setup";render();}
  else if(a==="start"){launch();}
  else if(a==="pick"){ if(!S.done[S.i]){ const k=+t.dataset.k, cur=S.answers[S.i]=S.answers[S.i]||[]; const ix=cur.indexOf(k); if(ix>=0) cur.splice(ix,1); else if(cur.length<MAXP) cur.push(k); else {cur.shift();cur.push(k);} const y=window.scrollY; render(true); window.scrollTo(0,y); } }
  else if(a==="valider"){ if((S.answers[S.i]||[]).length){S.done[S.i]=true;render();} }
  else if(a==="vote"){ const v=S.votes[S.i]=S.votes[S.i]||{}, r=t.dataset.r, k=+t.dataset.k, cur=v[r]=v[r]||[]; const ix=cur.indexOf(k); if(ix>=0) cur.splice(ix,1); else if(cur.length<MAXP) cur.push(k); else {cur.shift();cur.push(k);} const y=window.scrollY; render(true); window.scrollTo(0,y); const el=document.querySelector('.vb[data-r="'+r+'"][data-k="'+k+'"]'); if(el) el.focus({preventScroll:true}); }
  else if(a==="reveal"){S.shown=true;render();}
  else if(a==="next"){ if(S.i<g.scenes.length-1){S.i++;S.shown=false;S.screen="play";}else{S.screen="end";saveEnd();} render(); }
  else if(a==="again"){if(S.mode==="solo"){reset();S.screen="setup";render();}else{launch();}}
  else if(a==="print"){ try{window.print();}catch(_){} const h=$("#phint"); if(h) h.textContent="Si la fenêtre d’impression ne s’ouvre pas, utilisez Ctrl+P ou Cmd+P, puis « Enregistrer au format PDF »."; }
});
document.addEventListener("change",e=>{
  const t=e.target; if(!t.dataset||!t.dataset.act) return;
  if(t.dataset.act==="rolepick"){ const id=t.value; S.roles=t.checked?ROLES5.map(r=>r.id).filter(x=>S.roles.includes(x)||x===id):S.roles.filter(x=>x!==id); render(); }
  if(t.dataset.act==="rolesolo"){ S.role=t.value; }
});
init();
})();
</script></body></html>
